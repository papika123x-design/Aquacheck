function rankHtml(){
 const rows=st.rows.filter(o=>o.d>=st.f.from&&o.d<=st.f.to);
 const R=st.sites.map(si=>{const rs=rows.filter(o=>o.site==si),pr={},days={};let n=0,ex=0;
  st.avail.forEach(k=>{const t=stats(k,rs);if(t&&lim(k,si)){pr[k]=t;n+=t.n;ex+=t.ex}});
  rs.forEach(o=>{if(st.avail.some(k=>o[k]!=null&&evalP(k,o[k],si)===false))days[o.d]=1});
  return {si,n,ex,pct:n?ex/n*100:null,days:Object.keys(days).length,pr,bad:Object.keys(pr).filter(k=>pr[k].ex>0).sort((a,b)=>pr[b].pct-pr[a].pct)}
 }).sort((a,b)=>(b.pct==null?-1:b.pct)-(a.pct==null?-1:a.pct));
 const dot=x=>`<i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${sc(x)};margin-right:6px"></i>`;
 const cell=(p)=>p==null?'<td class="mut">–</td>':`<td style="${p>=5?"background:var(--badbg);color:var(--bad);font-weight:600":p>0?"background:var(--wbg);color:var(--warn);font-weight:600":"background:var(--okbg);color:var(--ok)"}">${fmt(p,1)}%</td>`;
 return `<div class="card wrap" style="margin-top:16px"><b>จัดอันดับสถานี</b> <span class="mut">เรียงตามสัดส่วนค่าที่เกินเกณฑ์ (เทียบทุกสถานีในช่วงวันที่ที่เลือก)</span><table style="margin-top:8px"><tr><th>อันดับ</th><th>สถานี</th><th>มาตรฐาน</th><th>ค่าที่มีเกณฑ์</th><th>เกินเกณฑ์</th><th style="width:140px">สัดส่วนเกิน</th><th>วันที่เกิน</th><th>พารามิเตอร์ที่เกิน (สัดส่วน)</th></tr>${R.map((x,i)=>`<tr><td>${x.pct==null?"–":i+1}</td><td>${dot(x.si)}${esc(x.si)}</td><td>${S[stdOf(x.si)].n}</td><td>${x.n.toLocaleString()}</td><td>${x.pct==null?"–":x.ex.toLocaleString()}</td><td>${x.pct==null?'<span class="pill">ไม่มีเกณฑ์</span>':`<div style="display:flex;gap:8px;align-items:center"><div class="bar no-print" style="flex:1"><i style="width:${Math.min(100,x.pct)}%;background:${x.pct>=5?"var(--bad)":x.pct>0?"var(--warn)":"var(--ok)"}"></i></div><span>${fmt(x.pct,1)}%</span></div>`}</td><td>${x.pct==null?"–":x.days}</td><td>${x.bad.length?x.bad.map(k=>k+" "+fmt(x.pr[k].pct,1)+"%").join(", "):(x.pct==null?"–":"ไม่มี")}</td></tr>`).join("")}</table></div>
 <div class="card wrap" style="margin-top:16px"><b>สัดส่วนค่าเกินเกณฑ์ แยกสถานีและพารามิเตอร์</b> <span class="mut">เขียว = ไม่เกิน · เหลือง = เกินน้อยกว่า 5% · แดง = เกิน 5% ขึ้นไป · – = ไม่มีเกณฑ์หรือไม่มีข้อมูล</span><table style="margin-top:8px"><tr><th>สถานี</th>${st.avail.map(k=>`<th>${k}</th>`).join("")}</tr>${R.map(x=>`<tr><td>${dot(x.si)}${esc(x.si)}</td>${st.avail.map(k=>cell(x.pr[k]?x.pr[k].pct:null)).join("")}</tr>`).join("")}</table></div>`;
}
V.compliance=()=>{
 const rows=view(),items=st.avail.map(k=>({k,s:stats(k,rows)})).filter(x=>x.s);
 const badItems=items.filter(x=>anyLim(x.k)&&x.s.ex>0);
 const now=new Date(),printDate=pad(now.getDate())+"/"+pad(now.getMonth()+1)+"/"+now.getFullYear()+" เวลา "+pad(now.getHours())+":"+pad(now.getMinutes())+" น.";
 const siteLabel=st.f.site?esc(st.f.site):`ทุกจุดตรวจวัด (${st.sites.length} สถานี)`;

 // ส่วนหัวเอกสารทางการ (แสดงเฉพาะตอนสั่งพิมพ์ / บันทึกเป็น PDF)
 const printHeader=`
 <div class="print-only doc-header">
   <div class="doc-title-row">
     <div>
       <div class="doc-org">AquaCheck · ระบบตรวจสอบและวิเคราะห์คุณภาพน้ำ</div>
       <div class="doc-title">รายงานผลการตรวจวัดคุณภาพน้ำเทียบเกณฑ์มาตรฐาน</div>
     </div>
     <div style="text-align:right;font-size:9pt;color:#475569">
       <div><b>วันที่ออกรายงาน:</b> ${printDate}</div>
       <div><b>แหล่งข้อมูล:</b> ${esc(st.fn||"-")}</div>
     </div>
   </div>
   <div class="doc-meta-grid">
     <div><b>มาตรฐานอ้างอิง:</b> ${esc(stdLabel())}</div>
     <div><b>จุดตรวจวัด / สถานี:</b> ${siteLabel}</div>
     <div><b>ช่วงวันที่ตรวจวัด:</b> ${dmy(st.f.from)} ถึง ${dmy(st.f.to)}</div>
     <div><b>จำนวนข้อมูลที่นำมาวิเคราะห์:</b> ${rows.length.toLocaleString()} รายการ</div>
   </div>
 </div>
 <div class="print-only doc-summary-boxes">
   <div class="doc-box">
     <div class="doc-box-lbl">จำนวนตัวอย่างทั้งหมด</div>
     <div class="doc-box-val">${rows.length.toLocaleString()} <span style="font-size:9.5pt;font-weight:400">รายการ</span></div>
   </div>
   <div class="doc-box">
     <div class="doc-box-lbl">พารามิเตอร์ที่ตรวจวัด</div>
     <div class="doc-box-val">${items.length} <span style="font-size:9.5pt;font-weight:400">พารามิเตอร์</span></div>
   </div>
   <div class="doc-box">
     <div class="doc-box-lbl">สรุปผลการประเมินเกณฑ์</div>
     <div class="doc-box-val" style="color:${badItems.length?"#991b1b":"#166534"}">${badItems.length?`เกินเกณฑ์ ${badItems.length} รายการ`:"ผ่านเกณฑ์มาตรฐานทั้งหมด"}</div>
   </div>
 </div>`;

 // ส่วนท้ายเอกสารและช่องลงนาม (แสดงเฉพาะตอนสั่งพิมพ์ / บันทึกเป็น PDF)
 const printFooter=`
 <div class="print-only doc-footer">
   <div class="doc-note">
     <b>หมายเหตุ:</b> ค่าเกณฑ์มาตรฐานและผลลัพธ์ทั้งหมดถูกแปลงหน่วยให้อยู่ในมาตรฐานเดียวกันก่อนทำการประเมินผล ${S[st.std].note?("· "+esc(S[st.std].note)):""}
   </div>
   <div class="sign-grid">
     <div>
       <div class="sign-line"></div>
       <div>( ........................................................................ )</div>
       <div style="font-weight:600;margin-top:2px">ผู้จัดทำรายงาน / ผู้ตรวจสอบข้อมูล</div>
       <div style="font-size:8.5pt;color:#475569">วันที่ ........ / ................ / ............</div>
     </div>
     <div>
       <div class="sign-line"></div>
       <div>( ........................................................................ )</div>
       <div style="font-weight:600;margin-top:2px">ผู้อนุมัติ / หัวหน้าหน่วยงาน</div>
       <div style="font-size:8.5pt;color:#475569">วันที่ ........ / ................ / ............</div>
     </div>
   </div>
 </div>`;

 app.innerHTML=printHeader+title("ผลเทียบมาตรฐาน","จำนวนครั้งที่ค่าเกินเกณฑ์ของ "+stdLabel()+" · ค่าเกณฑ์ใช้หน่วยตามมาตรฐาน")+bar()+
 `<div class="card wrap"><b class="print-only" style="margin-bottom:6px;font-size:10.5pt">ตารางที่ 1 สรุปผลการเปรียบเทียบค่าพารามิเตอร์กับเกณฑ์มาตรฐาน</b><table><tr><th>พารามิเตอร์</th><th>ค่าเกณฑ์ (หน่วยตามมาตรฐาน)</th><th>เฉลี่ย</th><th>ต่ำสุด</th><th>สูงสุด</th><th>ตัวอย่าง</th><th>เกินเกณฑ์</th><th class="no-print" style="width:140px">สัดส่วน</th><th>สถานะ</th></tr>${items.map(({k,s})=>`<tr><td><b>${k}</b> <span class="mut">${P[k].n}</span></td><td>${limTxt(k)}</td><td>${fmt(s.mean,2)}</td><td>${fmt(s.min,2)}</td><td>${fmt(s.max,2)}</td><td>${s.n.toLocaleString()}</td><td>${anyLim(k)?`${s.ex.toLocaleString()} (${fmt(s.pct,1)}%)`:"–"}</td><td class="no-print"><div class="bar"><i style="width:${Math.min(100,s.pct)}%;background:${s.pct>=5?"var(--bad)":"var(--warn)"}"></i></div></td><td>${pill(k,s)}</td></tr>`).join("")}</table></div>`+(st.sites.length>1?rankHtml():"")+
 (st.sites.length>1?`<div class="card wrap" style="margin-top:16px"><b>ค่าเฉลี่ยแยกตามจุดเก็บ</b> <span class="mut">สีแดงคือเกินเกณฑ์</span><table style="margin-top:8px"><tr><th>จุดเก็บ</th><th>มาตรฐาน</th>${st.avail.map(k=>`<th>${k}</th>`).join("")}</tr>${st.sites.map(si=>{const rs=rows.filter(o=>o.site==si);return `<tr><td>${esc(si)}</td><td>${S[stdOf(si)].n}</td>${st.avail.map(k=>{const t=stats(k,rs);return `<td style="${t&&evalP(k,t.mean,si)===false?"color:var(--bad);font-weight:600":""}">${t?fmt(t.mean,2):"–"}</td>`}).join("")}</tr>`}).join("")}</table></div>`:"")+
 printFooter+
 '<div class="foot"><button id="pr">พิมพ์ / บันทึกเป็น PDF (ฉบับทางการ)</button><button class="ghost" id="cs">ดาวน์โหลดสรุป (CSV)</button></div>';
 bindBar("compliance");$("#pr").onclick=()=>window.print();
 $("#cs").onclick=()=>save("compliance-summary.csv","พารามิเตอร์,ค่าเกณฑ์,เฉลี่ย,ต่ำสุด,สูงสุด,ตัวอย่าง,เกินเกณฑ์,สัดส่วนเกิน(%)\n"+items.map(({k,s})=>[k,csvq(limTxt(k)),fmt(s.mean,2),fmt(s.min,2),fmt(s.max,2),s.n,s.ex,fmt(s.pct,1)].join(",")).join("\n"));
};
const ready=r=>r=="upload"||(r=="map"?!!st.tbl:r=="clean"?!!st.rows:!!(st.rows&&st.rows.length));
function go(r){if(location.hash.slice(1)==r)render();else location.hash=r}
function render(){
 let r=location.hash.slice(1);if(!V[r])r="upload";
 if(!ready(r))r=st.tbl?"map":"upload";
 const nv=()=>document.querySelectorAll("aside a").forEach(a=>{a.classList.toggle("on",a.dataset.r==(r=="trends"?"overview":r));a.classList.toggle("dis",!ready(a.dataset.r))});nv();
 dr(false);{const ac=document.querySelector("aside a.on");$("#tbt").textContent=ac?ac.textContent:"AquaCheck"}
 try{V[r]();window.scrollTo(0,0)}catch(e){app.innerHTML='<div class="alert"><b>แสดงหน้านี้ไม่สำเร็จ</b><div>'+esc(e.message)+'</div><div class="foot"><button id="rs">กลับไปหน้านำเข้าไฟล์</button></div></div>';$("#rs").onclick=()=>go("upload")}
 nv();
}
const dr=o=>{document.body.classList.toggle("nav",o);$("#mn").setAttribute("aria-expanded",o)};
$("#mn").onclick=()=>dr(!document.body.classList.contains("nav"));$("#bd").onclick=()=>dr(false);
document.addEventListener("keydown",e=>{if(e.key=="Escape")dr(false)});
let lw=innerWidth,rt;addEventListener("resize",()=>{if(innerWidth==lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(()=>{const r=location.hash.slice(1);if(r=="overview"||r=="trends"){try{const y=scrollY;V[r]();scrollTo(0,y)}catch(e){}}},200)});
document.querySelectorAll("aside a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();if(a.classList.contains("dis"))return;go(a.dataset.r)}));
window.addEventListener("hashchange",render);
$("#theme").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()=="#0d1a21";d.setAttribute("data-theme",dark?"light":"dark")};
render();
</script>
</body>
</html>
