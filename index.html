<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaCheck – คลีนและวิเคราะห์ค่าน้ำเสีย</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{--bg:#eef2f4;--sf:#fff;--ink:#12303d;--mut:#5d7480;--ln:#d5dfe4;--side:#12303d;--sideink:#cfe3ea;--ac:#0f8b8d;--ok:#1f9d63;--bad:#d9542c;--warn:#b57a0a;--okbg:#e2f4ea;--badbg:#fbe6de;--wbg:#fbf0d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a21;--sf:#15262f;--ink:#e3eef2;--mut:#8ca5b0;--ln:#264049;--side:#091218;--ac:#3fc1c3;--ok:#4cc88a;--bad:#f27d56;--warn:#f0b84a;--okbg:#17372a;--badbg:#42241a;--wbg:#3d3216}}
:root[data-theme="dark"]{--bg:#0d1a21;--sf:#15262f;--ink:#e3eef2;--mut:#8ca5b0;--ln:#264049;--side:#091218;--ac:#3fc1c3;--ok:#4cc88a;--bad:#f27d56;--warn:#f0b84a;--okbg:#17372a;--badbg:#42241a;--wbg:#3d3216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:230px;flex:none;background:var(--side);color:var(--sideink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:19px;color:#fff;padding:0 10px 4px}
.sub{font-size:12px;padding:0 10px 18px;opacity:.7}
aside a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;font-size:14px}
aside a.on{background:#ffffff1f;color:#fff;font-weight:600}
aside a.dis{opacity:.4;pointer-events:none}
aside .grp{font-size:12px;opacity:.55;padding:14px 12px 4px}
main{flex:1;min-width:0;padding:28px 34px 50px;max-width:1280px}
h1{font-size:25px;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 18px;max-width:75ch}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px 20px}
.row{display:grid;gap:16px;margin-bottom:16px}
.c4{grid-template-columns:repeat(4,1fr)}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.big{font-size:30px;font-weight:700;line-height:1.15}
.mut{color:var(--mut);font-size:13px}
.drop{display:block;border:2px dashed var(--ac);border-radius:14px;padding:44px 20px;text-align:center;background:var(--sf);cursor:pointer}
.drop:hover{background:var(--okbg)}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
select,input[type=date],input[type=number]{font:inherit;padding:7px 10px;border-radius:8px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);max-width:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ln);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--wbg);color:var(--warn)}
.std{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1.5px solid var(--ln);border-radius:12px;background:var(--sf);cursor:pointer;margin-bottom:12px}
.std.sel{border-color:var(--ac);box-shadow:0 0 0 3px #0f8b8d33}
.std input{margin-top:5px;accent-color:var(--ac)}
.bar{height:8px;border-radius:5px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%}
svg text{fill:var(--mut);font:12px "IBM Plex Sans Thai",sans-serif}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{background:var(--sf);color:var(--ink);border:1px solid var(--ln);padding:6px 14px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.tabs b{color:var(--bad);margin-left:4px}
.foot{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding:12px 16px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.alert{background:var(--badbg);border:1px solid var(--bad);color:var(--ink);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.alert.okk{background:var(--okbg);border-color:var(--ok)}
.alist{max-height:280px;overflow:auto;margin-top:8px}
.mrow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(160px,1.2fr);gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--ln)}
.err{color:var(--bad);font-weight:600}
aside{overflow-y:auto}#theme{font-size:13px;padding:8px}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:6px}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.pc{cursor:pointer;transition:border-color .15s}.pc:hover,.pc:focus-visible{border-color:var(--ac)}
html{-webkit-text-size-adjust:100%}
#tb,#bd{display:none}
.wrap td:first-child,.wrap th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;box-shadow:1px 0 0 var(--ln)}
.wrap{-webkit-overflow-scrolling:touch;max-height:min(72vh,560px);overflow:auto}
.wrap th,.alist th{position:sticky;top:0;z-index:2;background:var(--sf);box-shadow:0 1px 0 var(--ln)}
.wrap th:first-child{z-index:4}
.alist th{background:var(--badbg)}
.card{min-width:0}
.wcard>b,.wcard>.mut{position:static}
#pv .wrap td:first-child{position:static;box-shadow:none;white-space:normal;min-width:140px}
#pv .wrap th:first-child{left:auto;box-shadow:0 1px 0 var(--ln)}
#pv .wrap{max-height:none;overflow-x:auto}
#pv .wrap th{position:static;box-shadow:0 1px 0 var(--ln);white-space:normal}
#pv{overflow:hidden}
@media(max-width:1023px){
body{flex-direction:column;font-size:16px}
#tb{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--side);color:#fff;padding:8px 14px}
#tb button{background:#ffffff26;padding:8px 14px}#tbt{font-weight:600;font-size:17px}
aside{position:fixed;left:0;top:0;bottom:0;height:auto;width:270px;z-index:40;transform:translateX(-105%);transition:transform .2s;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 18px}
body.nav aside{transform:none;box-shadow:0 0 30px #0009}
body.nav #bd{display:block;position:fixed;inset:0;background:#0007;z-index:30}
aside a{padding:13px 12px;font-size:16px}
main{padding:18px 16px 44px}
button,select,input[type=date],input[type=number]{min-height:44px;font-size:16px}
.c4,.c3,.c2{grid-template-columns:1fr 1fr}
.mrow{grid-template-columns:1fr;gap:4px;padding:8px 0}
.std{padding:14px}
}
@media(max-width:640px){
main{padding:14px 12px 40px}
.c3,.c2{grid-template-columns:1fr}
.card{padding:14px 14px}
.big{font-size:26px}h1{font-size:22px}
.filters{display:grid;gap:12px}
.filters>div:first-child{grid-column:1/-1}
.filters>*{min-width:0}
.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.filters label{min-width:0}
.filters select,.filters input{width:100%;min-width:0}
.filters input[type=date]{-webkit-appearance:none;appearance:none;display:block;padding:7px 8px;font-size:15px;text-align:left}
.filters .srcbtn{grid-column:1/-1}
.foot button{flex:1 1 auto}
}

/* ===== พิมพ์ / บันทึก PDF (A4) ===== */
.cap{text-align:center;margin-top:8px;font-size:14px}.fig svg{max-width:760px;display:block;margin:0 auto}
#md{position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}
#md .card{max-width:820px;width:100%;margin-top:3vh}#md p{margin:10px 0}
.subpick{margin:-4px 0 12px 26px;padding:10px 14px;border-left:3px solid var(--ac)}
.subpick label{display:flex;gap:8px;padding:6px 0;cursor:pointer;align-items:flex-start}.subpick input{margin-top:5px;accent-color:var(--ac)}
.subpick details{margin-top:8px}.subpick summary{cursor:pointer;color:var(--ac);font-weight:600}
.print-only{display:none}

/* ===== รายงานสรุป (ทางการ) ===== */
.rpt{background:var(--sf);color:var(--ink);border:1px solid var(--ln);box-shadow:0 2px 14px #0000001f;max-width:920px;margin:0 auto 18px;padding:40px 46px 32px;font-family:inherit;font-size:16px;line-height:1.7}
.rpt-letter{text-align:center;border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:6px}
.rpt-org{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:.03em}
.rpt-title{font-size:23px;font-weight:700;line-height:1.4;margin:4px 0 0}
.rpt-meta{display:flex;justify-content:space-between;gap:2px 16px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin:10px 0 0}
.rpt h2{font-size:17px;font-weight:700;margin:26px 0 10px;padding-bottom:3px;border-bottom:1px solid var(--ink);break-after:avoid}
.rpt p{margin:6px 0}.rpt ol{margin:6px 0 0;padding-left:24px}.rpt li{margin:3px 0}
.rpt table{font-size:14.5px}
.rpt .kv th,.rpt .kv td{white-space:normal;border:1px solid var(--ln);padding:6px 12px;vertical-align:top;text-align:left}
.rpt .kv th{width:34%;background:var(--bg);color:var(--ink);font-weight:600}
.rpt .dt th{background:var(--bg);color:var(--ink);font-weight:600;text-align:center;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:7px 10px}
.rpt .dt td{padding:6px 10px;border-bottom:1px solid var(--ln)}
.rpt .dt tbody tr:last-child td{border-bottom:2px solid var(--ink)}
.rpt .dt td.n{text-align:right;font-variant-numeric:tabular-nums}.rpt .dt td.c{text-align:center}
.rpt .dt td.l{white-space:normal;min-width:140px}
.rpt .wrap th{background:var(--bg)}
.rpt-cap{font-weight:600;font-size:15px;margin:16px 0 6px}
.rs{font-weight:700}.rs.ok{color:var(--ok)}.rs.bad{color:var(--bad)}.rs.na{color:var(--mut)}
.verdict{border:2px solid var(--mut);padding:12px 16px;margin:6px 0 12px;display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap}
.verdict.ok{border-color:var(--ok)}.verdict.bad{border-color:var(--bad)}
.verdict .vl{font-size:19px;font-weight:700;white-space:nowrap}.verdict.ok .vl{color:var(--ok)}.verdict.bad .vl{color:var(--bad)}
.kf{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln)}
.kf>div{padding:10px 12px;border-right:1px solid var(--ln);text-align:center}.kf>div:last-child{border-right:0}
.kf .v{font-size:24px;font-weight:700;line-height:1.25}.kf .t{font-size:13px;color:var(--mut)}
.rpt .fig{margin:14px 0 4px}.rpt .fig svg{max-width:720px;display:block;margin:0 auto}
.hi{background:var(--badbg);color:var(--bad);font-weight:700}.mid{background:var(--wbg);color:var(--warn);font-weight:700}
.sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;text-align:center;font-size:15px;margin-top:34px}
.sign-line{border-bottom:1px dotted var(--mut);height:40px;margin:0 auto 6px;width:75%}
.rpt-foot{margin-top:22px;padding-top:8px;border-top:1px solid var(--ln);font-size:13px;color:var(--mut);text-align:center}
@media(max-width:640px){.rpt{padding:22px 14px}.rpt-title{font-size:20px}.kf{grid-template-columns:1fr 1fr}.kf>div:nth-child(2){border-right:0}.kf>div:nth-child(-n+2){border-bottom:1px solid var(--ln)}.rpt .kv th{width:38%}.sign-grid{gap:16px}}
@page{size:A4 portrait;margin:25mm 20mm 20mm 30mm}
@media print{
:root:root:root{--bg:#fff;--sf:#fff;--ink:#000;--mut:#000;--ln:#000;--ac:#000;--ok:#000;--bad:#000;--warn:#000;--okbg:#fff;--badbg:#fff;--wbg:#fff}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;box-shadow:none!important}
html,body{background:#fff!important;color:#000!important;font-family:"TH Sarabun New","TH SarabunPSK","Sarabun",serif!important;font-size:16pt!important;line-height:1.45!important;margin:0!important;padding:0!important}
body{display:block!important}
/* ซ่อน UI ที่ไม่เกี่ยวกับการพิมพ์ทั้งหมด */
aside,#tb,#bd,.filters,.foot,.no-print,button,.cd-tools,.cd-legend{display:none!important}
main{max-width:100%!important;width:100%!important;padding:0!important;margin:0!important}
.print-only{display:block!important}
span.print-only{display:inline!important}

/* โครงสร้างรายงานเอกสารวิชาการ/ราชการไทย */
.cd{max-width:100%!important;margin:0!important;padding:0!important}
.cd-head{display:block!important;text-align:center;border-bottom:1.5pt solid #000;padding-bottom:8pt;margin-bottom:12pt}
.cd-org{font-size:16pt!important;font-weight:700!important;color:#000!important;letter-spacing:0!important}
.cd-title{font-size:20pt!important;font-weight:700!important;color:#000!important;margin:2pt 0!important;line-height:1.3!important}
.cd-docno{font-size:14pt!important;color:#000!important}

/* กล่องข้อมูลเมตาและสรุปผลการประเมิน */
.card{background:#fff!important;border:0!important;border-radius:0!important;padding:0!important;margin:0 0 12pt 0!important}
.cd-meta{display:grid!important;grid-template-columns:1fr 1fr;gap:2pt 18pt;border:1pt solid #000!important;padding:8pt 12pt!important;margin-bottom:12pt!important}
.cd-meta>div{border-bottom:0!important;padding:2pt 0!important;font-size:15pt!important;color:#000!important}
.cd-meta b{color:#000!important;font-weight:700!important;width:auto!important;margin-right:4pt}

.cd-verdict{display:flex!important;align-items:flex-start;gap:10pt;background:#fff!important;border:1.5pt solid #000!important;border-radius:0!important;padding:10pt 14pt!important;margin:10pt 0 12pt 0!important;break-inside:avoid}
.cd-verdict .cd-vi{width:24pt;height:24pt;font-size:15pt;background:#fff!important;color:#000!important;border:1pt solid #000!important;margin-top:2pt}
.cd-verdict .cd-vl{font-size:17pt!important;font-weight:700!important;color:#000!important}
.cd-verdict .cd-vt{font-size:16pt!important;color:#000!important;text-align:justify;text-justify:inter-word}

.cd-kpi{display:grid!important;grid-template-columns:repeat(4,1fr)!important;gap:0!important;border:1pt solid #000!important;margin-bottom:14pt!important;break-inside:avoid}
.cd-kpi>div{border:0!important;border-right:1pt solid #000!important;border-radius:0!important;padding:6pt 8pt!important;text-align:center}
.cd-kpi>div:last-child{border-right:0!important}
.cd-kpi .v,.cd-kpi .bad .v{font-size:18pt!important;font-weight:700!important;color:#000!important}
.cd-kpi .v small{font-size:14pt!important;color:#000!important}
.cd-kpi .t{font-size:14pt!important;color:#000!important}

/* หัวข้อหลักและหัวข้อย่อย */
.cd-sec{margin-top:16pt!important}
.cd-sec>h2{font-size:18pt!important;font-weight:700!important;color:#000!important;border-bottom:1pt solid #000!important;padding-bottom:2pt!important;margin:0 0 8pt 0!important;break-after:avoid;page-break-after:avoid}
.cd-sec>h2::before{display:none!important}
.cd-card h3{font-size:16pt!important;font-weight:700!important;color:#000!important;margin:8pt 0 4pt 0!important;break-after:avoid}

/* การจัดข้อความ: Justify และย่อหน้าบรรทัดแรก 2.5em */
.cd p,.cd-find p,.env-p{text-align:justify!important;text-justify:inter-word!important;text-indent:2.5em!important;font-size:16pt!important;line-height:1.45!important;color:#000!important;margin:4pt 0 8pt 0!important}

/* รายการ List แบบทางการ */
.cd-find ul,.cd-card ol{margin:4pt 0 8pt 0!important;padding-left:2.5em!important;color:#000!important;font-size:16pt!important;line-height:1.45!important}
.cd-find li,.cd-card li{margin:3pt 0!important;text-align:justify!important;text-justify:inter-word!important}
.cd-card a{color:#000!important;text-decoration:none!important;font-weight:400!important}
.cd-2{display:block!important}

/* ตารางกึ่งกลางหน้ากระดาษ + คำบรรยาย "ตารางที่..." และ "ที่มา: ..." */
.tw{overflow:visible!important;width:100%!important}
.doc-tbl-cap{text-align:left!important;font-size:16pt!important;color:#000!important;margin:8pt 0 4pt 0!important;break-after:avoid;page-break-after:avoid}
.cdt{width:100%!important;margin:0 auto!important;border-collapse:collapse!important;font-size:14pt!important;color:#000!important}
.cdt thead{display:table-header-group}
.cdt tr{break-inside:avoid;page-break-inside:avoid}
.cdt th,.cdt td{border:0.75pt solid #000!important;padding:4pt 6pt!important;color:#000!important;background:#fff!important;vertical-align:top!important}
.cdt th{background:#f2f2f2!important;font-weight:700!important;text-align:center!important}
.cdt td.w{white-space:normal!important}
.cdt .mut{font-size:13pt!important;color:#000!important;display:block}
.cdt tr.x td:first-child{box-shadow:none!important}
.cdt td[style*="var(--bad)"]{color:#000!important;font-weight:700!important;text-decoration:underline}

/* ป้ายสถานะในตารางพิมพ์แบบขาวดำเรียบ */
.pill,.pill.ok,.pill.bad,.pill.warn,.pill.na,.pill.nd{background:transparent!important;color:#000!important;border:0!important;padding:0!important;font-size:14pt!important;font-weight:400!important;opacity:1!important}
.pill.bad{font-weight:700!important}
.pill::before{display:none!important}

/* รูปภาพ / กราฟกึ่งกลางหน้ากระดาษ + คำบรรยาย "ภาพที่..." และ "ที่มา: ..." (คงสีกราฟตามเดิม) */
.cd-fig{text-align:center!important;margin:12pt auto!important;break-inside:avoid;page-break-inside:avoid}
.cd-fig svg{display:block!important;margin:0 auto!important;max-width:92%!important;height:auto!important;--ac:#0f8b8d;--bad:#c62828;--ok:#1f9d63;--ln:#cbd5e1;--mut:#334155}
.cd-fig svg text{font-family:"TH Sarabun New","Sarabun",sans-serif!important;fill:#1e293b!important}
.leg{justify-content:center!important;font-size:14pt!important;color:#000!important;margin-top:4pt!important}
.doc-fig-cap{text-align:center!important;font-size:16pt!important;color:#000!important;margin:6pt 0 2pt 0!important;break-before:avoid}
.doc-src{text-align:left!important;font-size:14pt!important;color:#000!important;margin:3pt 0 8pt 0!important;font-style:normal}

.cd-foot{margin-top:16pt!important;padding-top:6pt!important;border-top:0.75pt solid #000!important;font-size:14pt!important;color:#000!important;text-align:center!important;break-inside:avoid}
.cl3,.chips,.cdet{display:none!important}
}
</style>
</head>
<body>
<header id="tb"><button id="mn" aria-label="เปิดเมนู" aria-expanded="false">☰ เมนู</button><span id="tbt">AquaCheck</span></header><div id="bd"></div>
<aside>
<div class="brand">AquaCheck</div><div class="sub">คลีนและวิเคราะห์ค่าน้ำเสีย</div>
<div class="grp">เตรียมข้อมูล</div>
<a href="#upload" data-r="upload">1. นำเข้าไฟล์</a>
<a href="#map" data-r="map">2. จับคู่คอลัมน์</a>
<a href="#clean" data-r="clean">3. ผลการคลีน</a>
<a href="#standard" data-r="standard">4. เลือกมาตรฐาน</a>
<div class="grp">แดชบอร์ด</div>
<a href="#overview" data-r="overview">5. ภาพรวม</a>
<a href="#compliance" data-r="compliance">6. สรุป</a>
<div style="flex:1"></div>
<button class="ghost" id="theme" style="color:var(--sideink);border-color:#ffffff33">สลับโหมดมืด/สว่าง</button>
</aside>

function parseTable(t){
 t=t.replace(/^\uFEFF/,"");
 const first=t.split(/\r?\n/,1)[0],dl=[",",";","\t","|"].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];

 const push=()=>{row.push(cur);cur="";if(row.some(x=>x.trim()))rows.push(row);row=[]};
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;
  else if(c==dl){row.push(cur);cur=""}
  else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;push()}
  else cur+=c}
 if(cur||row.length)push();
 if(!rows.length)return null;

}

 const envExplain=({k,s})=>{
  const u0=P[k].u?" "+P[k].u:"",base=ENV_DESC[k]||"";
  let stTxt="";
  if(!anyLim(k))stTxt=`ในช่วงที่ตรวจวัดมีค่าเฉลี่ย ${fmt(s.mean,k=="pH"?2:1)}${u0} (ต่ำสุด ${fmt(s.min,2)} – สูงสุด ${fmt(s.max,2)}${u0}) โดยมาตรฐานที่เลือกไม่กำหนดเกณฑ์ควบคุมสำหรับพารามิเตอร์นี้`;
  else if(s.ex===0)stTxt=`ในช่วงที่ตรวจวัดมีค่าเฉลี่ย ${fmt(s.mean,k=="pH"?2:1)}${u0} (ต่ำสุด ${fmt(s.min,2)} – สูงสุด ${fmt(s.max,2)}${u0}) ซึ่งอยู่ในเกณฑ์มาตรฐาน (${limTxt(k)}) ตลอดช่วงการตรวจวัด (${s.n.toLocaleString()} ตัวอย่าง)`;
  else stTxt=`ในช่วงที่ตรวจวัดมีค่าเฉลี่ย ${fmt(s.mean,k=="pH"?2:1)}${u0} (ต่ำสุด ${fmt(s.min,2)} – สูงสุด ${fmt(s.max,2)}${u0}) พบค่าเกินเกณฑ์มาตรฐาน (${limTxt(k)}) จำนวน ${s.ex.toLocaleString()} จาก ${s.n.toLocaleString()} ตัวอย่าง (ร้อยละ ${fmt(s.pct,1)})`;
  return `${stTxt} ทั้งนี้ ค่า ${k} ${base}`;
 };
 const figs=items.map((x,idx)=>{

  return `<div class="card cd-fig"><div class="no-print"><b>กราฟที่ ${idx+1}</b> แสดง${cmpTxt}</div>${svg}<div class="print-only doc-fig-cap"><b>ภาพที่ ${idx+1}</b> แสดง${cmpTxt}</div><div class="print-only doc-src">${srcCite}</div><p class="env-p" style="margin:10px 0 0;font-size:14.5px;line-height:1.65"><b>คำอธิบายเชิงสิ่งแวดล้อม:</b> ${envExplain(x)}</p></div>`;
 }).join("");

<div class="print-only doc-src">${srcCite}</div></div>
  <div class="card" style="margin-top:16px"><div class="no-print"><b>ค่าเฉลี่ยแยกตามจุดตรวจวัด</b> <span class="mut">ตัวหนาสีแดง = เกินเกณฑ์</span></div><div class="print-only doc-tbl-cap"><b>ตารางที่ ๓</b> ค่าเฉลี่ยคุณภาพน้ำแยกตามจุดตรวจวัด</div><div class="tw" style="margin-top:8px"><table class="cdt"><thead><tr><th>จุดตรวจวัด</th>${st.avail.map(k=>`<th class="n">${k}</th>`).join("")}</tr></thead><tbody>${st.sites.map(si=>{const rs=rows.filter(o=>o.site==si);return `<tr><td class="w">${esc(si)}</td>${st.avail.map(k=>{const t=stats(k,rs);return `<td class="n" style="${t&&evalP(k,t.mean,si)===false?"color:var(--bad);font-weight:700":""}">${t?fmt(t.mean,2):"–"}</td>`}).join("")}</tr>`}).join("")}</tbody></table></div><div class="print-only doc-src">${srcCite}</div></div></section>`;
 }

 [...new Set(used.map(k=>S[k].note).filter(Boolean))].forEach(n=>notes.push(esc(n)));

 const rf=`<div class="card cd-card span2"><h3>เอกสารอ้างอิง</h3>${usedSrc.length?`<ol>${usedSrc.map(k=>`<li><a href="${esc(SRC[k].url)}" target="_blank" rel="noopener noreferrer" style="color:var(--ac);font-weight:600;text-decoration:underline">${esc(SRC[k].t)} ↗</a><span class="mut" style="display:block">${esc(SRC[k].m)}</span></li>`).join("")}</ol>`:'<div class="mut">ค่าเกณฑ์ที่ผู้ใช้กำหนดเอง ไม่มีเอกสารอ้างอิงในระบบ</div>'}</div>`;
 const s6=`<section class="cd-sec"><h2><span class="print-only">${multi?"๔. ":"๓. "}</span>ข้อมูลประกอบรายงาน</h2><div class="cd-2">${nt}${rf}</div></section>`;
 const head=`<header class="cd-head"><div><div class="cd-org">AquaCheck · ระบบตรวจสอบและวิเคราะห์คุณภาพน้ำ</div><h1 class="cd-title">รายงานผลการตรวจวัดและประเมินคุณภาพน้ำเชิงสิ่งแวดล้อม</h1><div class="cd-docno">เลขที่รายงาน ${docNo} · ออกรายงาน ${thd(iso)} เวลา <span style="white-space:nowrap">${hm} น.</span></div></div><div class="cd-tools no-print"><button id="pr">พิมพ์ / บันทึกเป็น PDF</button><button class="ghost" id="cs">ดาวน์โหลด Excel (.xlsx)</button></div></header>
  <div class="card cd-meta"><div><b>แหล่งข้อมูล</b><span>${esc(st.fn||"-")}</span></div><div><b>จุดตรวจวัด</b><span>${siteLabel}</span></div><div><b>ช่วงวันที่</b><span>${thd(st.f.from)} ถึง ${thd(st.f.to)}</span></div><div><b>มาตรฐานอ้างอิง</b><span>${esc(stdTxt)}</span></div></div>`;

 const verdict=`<div class="cd-verdict ${vk}" role="status"><div class="cd-vi" aria-hidden="true">${vi}</div><div><div class="cd-vl">${vl}</div><div class="cd-vt">${vt}</div></div></div><div class="cd-kpi">${kpi.map(([t,v,c])=>`<div><div class="${c}"><div class="v">${v}</div></div><div class="t">${t}</div></div>`).join("")}</div>`;
 const find=`<section class="cd-sec"><h2>สรุปประเด็นสำคัญเชิงสิ่งแวดล้อม (Key Environmental Findings)</h2><div class="card cd-find"><ul>${fd.map(x=>`<li>${x}</li>`).join("")}</ul></div></section>`;
 app.innerHTML=bar()+`<article class="cd">${head}${verdict}${find}${s3}${s4}${s5}${s6}<div class="cd-foot">จัดทำโดยระบบ AquaCheck · เลขที่รายงาน ${docNo}</div></article>`;
 bindBar("compliance");$("#pr").onclick=()=>window.print();
 $("#cs").onclick=async()=>{const b=$("#cs"),t=b.textContent;b.textContent="กำลังสร้างไฟล์…";b.disabled=true;try{await exportReport(true)}catch(e){await exportReport(false);alert("สร้างไฟล์ .xlsx ไม่ได้ (ต้องต่ออินเทอร์เน็ตเพื่อโหลดไลบรารี) จึงดาวน์โหลดเป็น CSV แทน")}b.textContent=t;b.disabled=false};
};
const ready=r=>r=="upload"||(r=="map"?!!st.tbl:r=="clean"?!!st.rows:!!(st.rows&&st.rows.length));

 const nv=()=>document.querySelectorAll("aside a").forEach(a=>{a.classList.toggle("on",a.dataset.r==(r=="trends"?"overview":r));a.classList.toggle("dis",!ready(a.dataset.r))});nv();
 dr(false);{const ac=document.querySelector("aside a.on");$("#tbt").textContent=ac?ac.textContent:"AquaCheck"}
 try{V[r]();window.scrollTo(0,0)}catch(e){app.innerHTML='<div class="alert"><b>แสดงหน้านี้ไม่สำเร็จ</b><div>'+esc(e.message)+'</div><div class="foot"><button id="rs">กลับไปหน้านำเข้าไฟล์</button></div></div>';$("#rs").onclick=()=>go("upload")}
 nv();
}
const dr=o=>{document.body.classList.toggle("nav",o);$("#mn").setAttribute("aria-expanded",o)};
$("#mn").onclick=()=>dr(!document.body.classList.contains("nav"));$("#bd").onclick=()=>dr(false);

$("#theme").onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue("--bg").trim()=="#0d1a21";d.setAttribute("data-theme",dark?"light":"dark")};
const fixWraps=()=>{app.querySelectorAll(".card.wrap,.wcard").forEach(c=>{const t=[...c.children].filter(e=>e.tagName=="TABLE");c.classList.remove("wrap");c.classList.add("wcard");t.forEach(tb=>{const d=document.createElement("div");d.className="wrap";tb.replaceWith(d);d.appendChild(tb)})})};

render();
